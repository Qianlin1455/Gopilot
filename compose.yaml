name: gopilot

services:
  demo-service:
    build:
      context: .
      dockerfile: deploy/demo-service.Dockerfile
    environment:
      DEMO_ADDR: ":8081"
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz >/dev/null || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    init: true
    restart: unless-stopped

  gopilot:
    build:
      context: .
      dockerfile: deploy/gopilot.Dockerfile
    environment:
      GOPILOT_ADDR: ":8080"
      DEMO_SERVICE_URL: "http://demo-service:8081"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_THINKING: "${LLM_THINKING:-}"
    expose:
      - "8080"
    depends_on:
      demo-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    init: true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      demo-service:
        condition: service_healthy
      gopilot:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    init: true
    restart: unless-stopped

