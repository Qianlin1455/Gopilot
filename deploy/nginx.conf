server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Raw pprof remains private to the Compose network. GoPilot retrieves and
    # normalizes it through the evidence tools instead of exposing it publicly.
    location ^~ /demo/debug/pprof/ {
        return 404;
    }

    location /demo/ {
        proxy_pass http://demo-service:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /gopilot/ {
        proxy_pass http://gopilot:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 190s;
        proxy_send_timeout 190s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

